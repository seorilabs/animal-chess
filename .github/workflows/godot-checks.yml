# main 정적 게이트와 Android export 계약을 조직 재사용 워크플로우에서 실행한다.
name: Godot Checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: godot-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    uses: seorilabs/.github/.github/workflows/godot-checks.yml@ab9305632698fcb949d4c9df58cf18dbce73bef8
    with:
      godot_version: "4.7.2"
      with_export_templates: true
      runs_on: seorilabs-rpi-arm64
      project_dir: godot
      check_command: |
        REQUIRE_GODOT_EXPORT_TEMPLATES=1 VERIFY_EXPORT_PACKS=1 bash scripts/check_native_export_contract.sh
        bash scripts/godot_quality_gate.sh --project godot --smoke-scene res://tests/test_runner.tscn
